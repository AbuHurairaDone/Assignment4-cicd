name: CD Pipeline
on:
  push:
    branches: [develop]
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Removed the environment line so it looks at global Repository Secrets
    steps:
      - uses: actions/checkout@v4
      - run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      - run: echo "Deployed successfully at $(date)"