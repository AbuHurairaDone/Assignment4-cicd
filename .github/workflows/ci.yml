name: CI Pipeline
on:
  pull_request:
    branches: [develop]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: |
          docker build -t  ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:latest .
          docker tag  ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:latest  ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:${{ github.sha }}
      - run: |
          docker push  ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:latest
          docker push  ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:${{ github.sha }}